<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- Every file below is found relative to the app's own folder. A page such as /groups/abc or /settings/password is not
         in that folder, so this first script says where the folder is (everything before the first page name), and the
         browser then reads the relative addresses from there. See tests/base.test.ts. -->
    <script id="base-init">
      (function () {
        var seg = location.pathname.split('/');
        var pages = ['month', 'plan', 'groups', 'export', 'payments', 'settings', 'add'];
        var cut = seg.length - 1;
        for (var i = 1; i < seg.length; i++) if (pages.indexOf(seg[i]) >= 0) { cut = i; break; }
        var base = document.createElement('base');
        base.href = seg.slice(0, cut).join('/') + '/';
        document.head.insertBefore(base, document.head.firstChild);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f3" />
    <meta name="color-scheme" content="light dark" />
    <!-- a classic script on purpose (not a module): it must run before the first paint so a dark phone never flashes white -->
    <script src="./theme-init.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Money Log" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Money Log</title>
  </head>
  <body>
    <div id="root">
      <!-- The start screen, here as plain markup so there is no blank moment before the first script has run. React replaces it
           with the same thing (src/ui/Splash.tsx) and then fades it out. Keep the two in step. -->
      <div class="splash fixed inset-0 z-[60] flex flex-col items-center justify-center gap-4 bg-[linear-gradient(160deg,#1b6b47_0%,#124d33_55%,#0a3322_100%)] text-[#ffffff] transition-opacity duration-300" role="status" aria-label="Opening Money Log">
        <svg width="112" height="112" viewBox="64 64 384 384" aria-hidden="true" focusable="false" class="animate-splash-in">
        <defs><linearGradient id="logo-ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3f6a0"/><stop offset="1" stop-color="#b9de55"/></linearGradient></defs>
        <circle cx="256" cy="256" r="196" fill="#ffffff" fill-opacity="0.06"/>
        <circle class="animate-ring" cx="256" cy="256" r="196" fill="none" stroke="#c9e96a" stroke-opacity="0.55" stroke-width="6"/>
        <circle cx="256" cy="256" r="172" fill="none" stroke="#c9e96a" stroke-opacity="0.16" stroke-width="2"/>
        <path d="M120 372 L196 318 L246 346 L318 268 L392 214" fill="none" stroke="#c9e96a" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <g fill="none" stroke="url(#logo-ink)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"><path d="M164 150 H352 M164 208 H352"/><path d="M164 150 H232 C292 150 312 184 312 208 C312 258 270 280 232 280 L336 392"/></g>
      </svg>
        <p class="m-0 text-[26px] font-bold tracking-[-0.01em]">Money Log</p>
        <p class="m-0 text-sm text-[#ffffffb3]">Opening your payments…</p>
      </div>
    </div>
    <noscript>Money Log needs JavaScript to run.</noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
