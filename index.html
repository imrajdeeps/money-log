<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- Every file below is found relative to the app's own folder. A page such as /groups/abc or /settings/password is not
         in that folder, so this first script says where the folder is (everything before the first page name), and the
         browser then reads the relative addresses from there. See tests/base.test.ts. -->
    <script id="base-init">
      (function () {
        var seg = location.pathname.split('/');
        var pages = ['month', 'plan', 'groups', 'payments', 'settings', 'add'];
        var cut = seg.length - 1;
        for (var i = 1; i < seg.length; i++) if (pages.indexOf(seg[i]) >= 0) { cut = i; break; }
        var base = document.createElement('base');
        base.href = seg.slice(0, cut).join('/') + '/';
        document.head.insertBefore(base, document.head.firstChild);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f3" />
    <meta name="color-scheme" content="light dark" />
    <!-- a classic script on purpose (not a module): it must run before the first paint so a dark phone never flashes white -->
    <script src="./theme-init.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hisaab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Hisaab</title>
  </head>
  <body>
    <div id="root">

           with the same thing (src/ui/Splash.tsx) and then fades it out. Keep the two in step. -->

          <svg width="96" height="96" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><rect width="512" height="512" rx="112" fill="#104a30"/><path transform="translate(143.74 347.90) scale(0.37927 -0.37927)" fill="#c9e96a" d="M350 47Q368 61 378.0 76.0Q388 91 388 107Q388 128 369.0 141.0Q350 154 309 154Q260 154 233.5 136.0Q207 118 207 86Q207 60 229.0 38.5Q251 17 298.5 -3.5Q346 -24 422 -49L359 -169Q250 -140 182.0 -102.5Q114 -65 82.5 -18.0Q51 29 51 84Q51 151 87 193Q95 202 105 211Q83 230 71 250Q50 283 50 319Q50 382 97.0 415.0Q144 448 230 448H348V498H0V622H592V498H503V330H254Q227 330 215.5 321.0Q204 312 204 295Q204 281 216 268Q218 266 220 263Q265 273 317 273Q397 273 447.0 251.0Q497 229 520.0 193.0Q543 157 543 113Q543 75 528.0 42.5Q513 10 481 -21Z"/></svg>
        </div>
        <p class="m-0 text-[26px] font-bold tracking-[-0.01em]">Hisaab</p>
        <p class="m-0 text-sm text-muted">Opening your payments…</p>
      </div>
    </div>
    <noscript>Hisaab needs JavaScript to run.</noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
