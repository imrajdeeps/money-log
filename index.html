<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- Every file below is found relative to the app's own folder. A page such as /groups/abc or /settings/password is not
         in that folder, so this first script says where the folder is (everything before the first page name), and the
         browser then reads the relative addresses from there. See tests/base.test.ts. -->
    <script id="base-init">
      (function () {
        var seg = location.pathname.split('/');
        var pages = ['month', 'plan', 'groups', 'payments', 'settings', 'add'];
        var cut = seg.length - 1;
        for (var i = 1; i < seg.length; i++) if (pages.indexOf(seg[i]) >= 0) { cut = i; break; }
        var base = document.createElement('base');
        base.href = seg.slice(0, cut).join('/') + '/';
        document.head.insertBefore(base, document.head.firstChild);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f3" />
    <meta name="color-scheme" content="light dark" />
    <!-- a classic script on purpose (not a module): it must run before the first paint so a dark phone never flashes white -->
    <script src="./theme-init.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hisaab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Hisaab</title>
  </head>
  <body>
    <div id="root">
      <!-- The start screen, here as plain markup so there is no blank moment before the first script has run. React replaces it
           with the same thing (src/ui/Splash.tsx) and then fades it out. Keep the two in step. -->
      <div class="splash fixed inset-0 z-[60] flex flex-col items-center justify-center gap-4 bg-bg text-ink transition-opacity duration-300" role="status" aria-label="Opening Hisaab">
        <div class="relative w-[136px] h-[136px] flex items-center justify-center animate-splash-in">
          <svg class="absolute inset-0" width="136" height="136" viewBox="0 0 136 136" aria-hidden="true" focusable="false"><circle cx="68" cy="68" r="64" fill="none" stroke="#c9e96a" stroke-opacity="0.25" stroke-width="3"/><circle class="animate-ring origin-center [transform-box:fill-box]" cx="68" cy="68" r="64" fill="none" stroke="#c9e96a" stroke-width="3" stroke-dasharray="100 302" stroke-linecap="round"/></svg>
          <svg width="96" height="96" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><rect width="512" height="512" rx="112" fill="#104a30"/><g transform="translate(95.35 90.31) scale(12.6)" fill="none" stroke="#c9e96a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M5 11.5h8M12.5 16.5l2.8 2.8 5.2-5.8"/></g></svg>
        </div>
        <p class="m-0 text-[26px] font-bold tracking-[-0.01em]">Hisaab</p>
        <p class="m-0 text-sm text-muted">Opening your payments…</p>
      </div>
    </div>
    <noscript>Hisaab needs JavaScript to run.</noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
